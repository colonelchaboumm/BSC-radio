name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - bsc_studio/__init__.py
      - .github/workflows/windows-release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check source and tests
        run: |
          python -m ruff check bsc_studio scripts run_studio.py tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          "ISCC_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows installer
        run: python scripts/build_windows.py --iscc "$env:ISCC_PATH"
      - name: Verify packaged application without API calls
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $report = Join-Path (Get-Location) 'packaged-selftest.json'
          $process = Start-Process -FilePath '.\dist\BSC-Radio-Studio\BSC-Radio-Studio.exe' -ArgumentList @('--self-test','--report',"`"$report`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged application verification failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged application report failed' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BSC-Radio-Studio-Windows-x64
          path: |
            release/*
            packaged-selftest.json
      - name: Publish stable release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from bsc_studio import __version__; print(__version__)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag exists; immutable installer is preserved. Increment __version__ for the next release."
            exit 0
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "BSC Radio Studio $version" --notes-file RELEASE_NOTES.md release/BSC-Radio-Studio-Setup-x64.exe release/SHA256SUMS.txt release/BSC-Radio-Studio-Portable-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
