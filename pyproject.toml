[project]
name = "bsc-radio-studio"
version = "0.1.1"
description = "Studio Windows de podcasts pour Brewers Social Club"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-or-later"

[tool.pytest.ini_options]
pythonpath = [".", "engine"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 140
exclude = ["engine"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
